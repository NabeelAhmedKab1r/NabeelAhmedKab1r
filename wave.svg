<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<style>
.body{animation:bob 1.6s ease-in-out infinite;transform-origin:60px 100px}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.arm{transform-box:view-box;transform-origin:88px 64px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0deg)}15%{transform:rotate(-15deg)}30%{transform:rotate(20deg)}45%{transform:rotate(-15deg)}60%{transform:rotate(20deg)}75%{transform:rotate(0deg)}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
<ellipse cx="60" cy="108" rx="30" ry="5" fill="#000" opacity=".15"/>
<g class="body">
  <g class="arm">
    <path d="M86 66 Q100 52 104 36" stroke="#FFC83D" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M86 66 Q100 52 104 36" stroke="#F2A900" stroke-width="13" stroke-linecap="round" fill="none" opacity=".25"/>
  </g>
  <path d="M60 22 C88 22 98 48 98 70 C98 94 82 104 60 104 C38 104 22 94 22 70 C22 48 32 22 60 22 Z" fill="#FFC83D"/>
  <path d="M60 22 C88 22 98 48 98 70 C98 94 82 104 60 104 C38 104 22 94 22 70 C22 48 32 22 60 22 Z" fill="none" stroke="#F2A900" stroke-width="2.5"/>
  <ellipse cx="46" cy="38" rx="10" ry="6" fill="#fff" opacity=".45" transform="rotate(-25 46 38)"/>
  <ellipse class="eye" cx="48" cy="62" rx="4.5" ry="6.5" fill="#3b2a12"/>
  <ellipse class="eye" cx="72" cy="62" rx="4.5" ry="6.5" fill="#3b2a12"/>
  <circle cx="49.5" cy="59.5" r="1.6" fill="#fff"/><circle cx="73.5" cy="59.5" r="1.6" fill="#fff"/>
  <ellipse cx="39" cy="74" rx="6" ry="3.5" fill="#ff8a8a" opacity=".55"/>
  <ellipse cx="81" cy="74" rx="6" ry="3.5" fill="#ff8a8a" opacity=".55"/>
  <path d="M53 74 Q60 82 67 74" stroke="#3b2a12" stroke-width="3" stroke-linecap="round" fill="none"/>
</g>
</svg>
